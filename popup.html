<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kemono Friends - Debug Log</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 800px;
            height: 600px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e1e;
            color: #d4d4d4;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #252526;
            padding: 12px 16px;
            border-bottom: 1px solid #3e3e42;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
        }

        .controls {
            display: flex;
            gap: 8px;
        }

        button {
            padding: 6px 12px;
            background: #0e639c;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.2s;
        }

        button:hover {
            background: #1177bb;
        }

        button:active {
            background: #0a4d75;
        }

        button.danger {
            background: #c72e2e;
        }

        button.danger:hover {
            background: #e63939;
        }

        .filter {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 8px 16px;
            background: #252526;
            border-bottom: 1px solid #3e3e42;
        }

        .filter label {
            font-size: 12px;
            color: #cccccc;
        }

        .filter select {
            padding: 4px 8px;
            background: #3c3c3c;
            color: #d4d4d4;
            border: 1px solid #555;
            border-radius: 4px;
            font-size: 12px;
        }

        .filter input[type="checkbox"] {
            margin-right: 4px;
        }

        .log-container {
            flex: 1;
            overflow-y: auto;
            padding: 4px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 11px;
            line-height: 1.2;
        }

        .log-entry {
            padding: 2px 6px;
            margin-bottom: 1px;
            border-left: 2px solid transparent;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .log-entry.log {
            border-left-color: #4ec9b0;
            background: rgba(78, 201, 176, 0.1);
        }

        .log-entry.warn {
            border-left-color: #dcdcaa;
            background: rgba(220, 220, 170, 0.1);
        }

        .log-entry.error {
            border-left-color: #f48771;
            background: rgba(244, 135, 113, 0.1);
        }

        .log-entry.debug {
            border-left-color: #569cd6;
            background: rgba(86, 156, 214, 0.1);
        }

        .log-time {
            color: #858585;
            margin-right: 6px;
            font-size: 10px;
        }

        .log-level {
            font-weight: 600;
            margin-right: 6px;
            font-size: 10px;
        }

        .log-level.log {
            color: #4ec9b0;
        }

        .log-level.warn {
            color: #dcdcaa;
        }

        .log-level.error {
            color: #f48771;
        }

        .log-level.debug {
            color: #569cd6;
        }

        .log-message {
            color: #d4d4d4;
            display: inline;
        }

        .log-object {
            margin-left: 16px;
            color: #ce9178;
            font-size: 10px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #858585;
        }

        .stats {
            display: flex;
            gap: 16px;
            padding: 8px 16px;
            background: #252526;
            border-top: 1px solid #3e3e42;
            font-size: 11px;
            color: #858585;
        }

        .stat-item {
            display: flex;
            gap: 4px;
        }

        .stat-value {
            color: #4ec9b0;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🐾 Kemono Friends - Debug Log</h1>
        <div class="controls">
            <button id="clear-btn">清除日誌</button>
            <button id="export-btn">匯出日誌</button>
            <button id="toggle-btn">暫停/繼續</button>
        </div>
    </div>
    <div class="filter">
        <label>
            <input type="checkbox" id="auto-scroll" checked> 自動滾動
        </label>
        <label>
            等級篩選:
            <select id="level-filter">
                <option value="all">全部</option>
                <option value="log">Log</option>
                <option value="debug">Debug</option>
                <option value="warn">Warn</option>
                <option value="error">Error</option>
            </select>
        </label>
        <label>
            搜尋:
            <input type="text" id="search-input" placeholder="搜尋日誌..." style="padding: 4px 8px; background: #3c3c3c; color: #d4d4d4; border: 1px solid #555; border-radius: 4px; font-size: 12px; width: 200px;">
        </label>
    </div>
    <div class="log-container" id="log-container">
        <div class="empty-state">等待日誌輸出...</div>
    </div>
    <div class="stats">
        <div class="stat-item">
            <span>總日誌數:</span>
            <span class="stat-value" id="total-count">0</span>
        </div>
        <div class="stat-item">
            <span>Log:</span>
            <span class="stat-value" id="log-count">0</span>
        </div>
        <div class="stat-item">
            <span>Debug:</span>
            <span class="stat-value" id="debug-count">0</span>
        </div>
        <div class="stat-item">
            <span>Warn:</span>
            <span class="stat-value" id="warn-count">0</span>
        </div>
        <div class="stat-item">
            <span>Error:</span>
            <span class="stat-value" id="error-count">0</span>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
